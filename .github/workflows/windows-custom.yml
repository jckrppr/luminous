
name: Build Custom Windows Luminous

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure custom installer
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json

          # No updater signing required
          $config.bundle.createUpdaterArtifacts = $false

          # Install for the current Windows user
          $config.bundle.windows.nsis | Add-Member `
            -NotePropertyName installMode `
            -NotePropertyValue currentUser `
            -Force

          $config | ConvertTo-Json -Depth 100 |
            Set-Content $path -Encoding utf8

      - name: Build NSIS installer
        run: bun run tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Luminous-Custom-Installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
